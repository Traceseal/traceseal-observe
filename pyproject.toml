[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceseal-observe"
version = "1.5.0"
description = "Verifiable, hash-chained, timestamped evidence of what AI agents did: signed receipts for model calls, tools, data flows, human oversight and compliance"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["ai", "agents", "observability", "receipts", "ed25519", "traceseal", "anthropic", "openai", "audit", "compliance", "eu-ai-act", "gdpr", "transparency-log", "rfc3161"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42.0"]

[project.scripts]
traceseal-resolution = "traceseal_observe.resolution:main"
traceseal-identity = "traceseal_observe.identity:main"
publisher-attest = "traceseal_observe.publisher:main"
publisher-bind = "traceseal_observe.binding:main"
publisher-key = "traceseal_observe.history:main"
traceseal-selection = "traceseal_observe.selection:main"
traceseal-chain = "traceseal_observe.chain:main"
traceseal-trace = "traceseal_observe.trace:main"
traceseal-report = "traceseal_observe.report:main"
traceseal-keys = "traceseal_observe.directory:main"

[project.optional-dependencies]
timestamp = ["asn1crypto>=1.5"]
otel = ["opentelemetry-api>=1.20"]
disclosure = ["cryptography>=47.0"]
dev = [
    "pytest>=7.0",
    "asn1crypto>=1.5",
    "anthropic",
    "openai",
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://traceseal.io"
Specification = "https://traceseal.io/spec"
Source = "https://github.com/traceseal/traceseal-observe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
