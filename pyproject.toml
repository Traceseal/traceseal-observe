[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceseal-observe"
version = "1.4.0"
description = "Signed execution receipts for AI model calls and tool invocations"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["ai", "agents", "observability", "receipts", "ed25519", "traceseal", "anthropic", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41.0"]

[project.scripts]
traceseal-resolution = "traceseal_observe.resolution:main"
traceseal-identity = "traceseal_observe.identity:main"
publisher-attest = "traceseal_observe.publisher:main"
publisher-bind = "traceseal_observe.binding:main"
publisher-key = "traceseal_observe.history:main"
traceseal-selection = "traceseal_observe.selection:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://traceseal.io"
Specification = "https://traceseal.io/spec"
Source = "https://github.com/traceseal/traceseal-observe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
